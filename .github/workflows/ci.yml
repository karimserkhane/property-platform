name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm docs:check
      - run: pnpm build
      - run: node scripts/prepare-web-runtime.mjs
      - run: pnpm smoke:web
      - run: docker build -t liwa-web-ci -f apps/web/Dockerfile .

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: liwa
          POSTGRES_USER: liwa
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U liwa -d liwa"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: liwa.config.settings.testing
      DATABASE_URL: postgresql://liwa:ci-only-password@localhost:5432/liwa
      LIWA_TEST_POSTGIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api lint-imports --config apps/api/pyproject.toml
      - run: uv run --project apps/api python apps/api/manage.py check
      - run: uv run --project apps/api python apps/api/manage.py makemigrations --check --dry-run
      - run: uv run --project apps/api python apps/api/manage.py migrate --noinput
      - run: uv run --project apps/api pytest apps/api/tests -c apps/api/pyproject.toml
      - run: uv run --project apps/api python -m liwa.export_openapi --output packages/contracts/openapi.json
      - run: git diff --exit-code -- packages/contracts/openapi.json
      - run: docker compose -f infra/local/compose.yaml config --quiet
      - run: docker build -t liwa-api-ci -f apps/api/Dockerfile .
      - run: docker run --rm -e DJANGO_SETTINGS_MODULE=liwa.config.settings.local liwa-api-ci python manage.py check
