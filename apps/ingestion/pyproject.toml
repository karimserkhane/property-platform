[project]
name = "property-platform-ingestion"
version = "0.1.0"
description = "Scheduled acquisition and ingestion using the platform domain services"
requires-python = ">=3.14.8,<3.15"
dependencies = [
  "prefect==3.8.8",
  # Prefect's scheduled-run bulk inserts are incompatible with SQLAlchemy 2.1 hybrids.
  "sqlalchemy[asyncio]==2.0.55",
  "httpx==0.28.1",
  "pyarrow==26.0.0",
  # Raster arithmetic of the Sentinel-2 activity signal (B06); never in the API runtime.
  "numpy==2.5.4",
  "property-platform-api",
]

[tool.uv.sources]
property-platform-api = { path = "../api", editable = true }

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "ruff==0.17.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_platform_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
