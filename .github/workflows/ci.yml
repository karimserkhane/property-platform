name: Foundation checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm contracts:check
      - run: pnpm typecheck
      - run: pnpm test:web
      - run: pnpm docs:check
      - run: docker compose -f infra/local/compose.yaml -f infra/local/compose.remote-preview.yaml --profile web-preview --profile remote-preview config --quiet
      - run: pnpm build
      - run: node scripts/prepare-web-runtime.mjs
      - run: pnpm smoke:web
      - run: docker build -t property-platform-web-ci -f apps/web/Dockerfile .

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
        env:
          POSTGRES_DB: property_platform
          POSTGRES_USER: property_platform
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U property_platform -d property_platform"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: property_platform.config.settings.testing
      DATABASE_URL: postgresql://property_platform:ci-only-password@localhost:5432/property_platform
      PROPERTY_PLATFORM_TEST_POSTGIS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14.8"
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - run: uv run --project apps/api lint-imports --config apps/api/pyproject.toml
      - run: uv run --project apps/api python apps/api/manage.py check
      - run: uv run --project apps/api python apps/api/manage.py makemigrations --check --dry-run
      - run: uv run --project apps/api python apps/api/manage.py migrate --noinput
      - run: uv run --project apps/api pytest apps/api/tests -c apps/api/pyproject.toml
      - run: uv run --project apps/api python -m property_platform.export_openapi --output packages/contracts/openapi.json
      - run: git diff --exit-code -- packages/contracts/openapi.json packages/contracts/territories.json packages/contracts/map-credits.json
      - run: docker compose -f infra/local/compose.yaml config --quiet
      - run: docker build -t property-platform-api-ci -f apps/api/Dockerfile .
      - run: docker run --rm -e DJANGO_SETTINGS_MODULE=property_platform.config.settings.local property-platform-api-ci python manage.py check

  # Browser journeys against the versioned demonstration package (A13,
  # docs/engineering/E2E.md): disposable PostGIS, migrations, replay, API, Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_COMPOSE: docker compose -f infra/local/compose.e2e-demo.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: $E2E_COMPOSE config --quiet
      - run: $E2E_COMPOSE build
      - name: Replay the demonstration package and start the API
        run: $E2E_COMPOSE up -d --wait api
      - run: $E2E_COMPOSE run --rm checks-e2e
      - name: API and replay logs
        if: failure()
        run: $E2E_COMPOSE logs --no-color api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-traces
          path: .cache/e2e/
          retention-days: 14
      - if: always()
        run: $E2E_COMPOSE down

  ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREFECT_HOME: ${{ github.workspace }}/.cache/prefect
      PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.14.8"
      - run: uv lock --project apps/ingestion --check
      - run: uv sync --project apps/ingestion --frozen
      - run: uv run --project apps/ingestion ruff check apps/ingestion
      - run: uv run --project apps/ingestion ruff format --check apps/ingestion
      - run: uv run --project apps/ingestion pytest apps/ingestion/tests -c apps/ingestion/pyproject.toml
      - run: docker compose -f infra/local/compose.yaml -f infra/local/compose.ingestion.yaml --profile ingestion config --quiet
      - run: docker compose -f infra/local/compose.yaml -f infra/local/compose.ingestion.yaml -f infra/local/compose.map-analysis.yaml --profile ingestion --profile map-analysis config --quiet
      - run: docker compose -f infra/local/compose.yaml -f infra/local/compose.ingestion.yaml -f infra/local/compose.embeddings.yaml --profile ingestion --profile embeddings config --quiet
      - name: Validate optional R2 storage configuration without contacting the cloud
        env:
          MEDIA_S3_ENDPOINT_URL: https://ci-account.r2.cloudflarestorage.com
          MEDIA_S3_BUCKET: ci-private-media
          MEDIA_S3_ACCESS_KEY_ID: configuration-test-only
          MEDIA_S3_SECRET_ACCESS_KEY: configuration-test-only
        run: docker compose -f infra/local/compose.yaml -f infra/local/compose.ingestion.yaml -f infra/local/compose.storage.s3.yaml --profile ingestion config --quiet
      - run: docker build -t property-platform-ingestion-ci -f apps/ingestion/Dockerfile .
      - run: docker run --rm --network none property-platform-ingestion-ci python -m property_platform_ingestion datasets

  # A38 (docs/engineering/TOOLCHAIN.md#chaîne-dapprovisionnement): every action and image is
  # pinned by digest, one digest per image tag, and the pinned images are scanned below.
  supply-chain-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pins.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pins
        run: node scripts/check-supply-chain-pins.mjs --github-output

  # Grype (Apache-2.0, no account). Policy: a critical vulnerability with a published fix fails
  # the job; everything else is listed in the job summary without blocking.
  vulnerabilities:
    needs: supply-chain-pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.supply-chain-pins.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.target == 'lockfiles'
      - id: blocking
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: ${{ matrix.target == 'lockfiles' && '.' || '' }}
          image: ${{ matrix.target != 'lockfiles' && matrix.target || '' }}
          grype-version: v0.121.0
          cache-db: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
          output-file: grype-blocking.txt
      - id: listed
        if: always()
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: ${{ matrix.target == 'lockfiles' && '.' || '' }}
          image: ${{ matrix.target != 'lockfiles' && matrix.target || '' }}
          grype-version: v0.121.0
          cache-db: true
          fail-build: false
          output-format: table
          output-file: grype-all.txt
      - if: always()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "### Grype: ${TARGET}"
            echo
            echo "Critical with a fix (blocking):"
            echo '```'
            cat grype-blocking.txt 2>/dev/null || echo "(no report)"
            echo '```'
            echo "All findings:"
            echo '```'
            head -c 60000 grype-all.txt 2>/dev/null || echo "(no report)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
