packages:
  - apps/web
  - packages/*

saveExact: true
engineStrict: true
strictPeerDependencies: true
storeDir: .pnpm-store
allowBuilds:
  # Platform binaries are provided by optional dependencies; no lifecycle build is needed.
  '@parcel/watcher': false
  '@swc/core': false
minimumReleaseAgeExclude:
  - '@types/node@26.6.5'
  - maplibre-gl@6.14.0
