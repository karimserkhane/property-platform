# Grype exceptions (A40, docs/engineering/TOOLCHAIN.md#chaîne-dapprovisionnement). Each rule names one
# vulnerability in one package at one exact version, so the same CVE stays blocking anywhere else
# (another image, another package version). Remove a rule as soon as the image it covers is updated.
ignore:
  # text-embeddings-inference cpu-1.9.3 (infra/local/compose.embeddings.yaml), Debian 12 packages.
  # Checked on 6 November 2026: the latest release, cpu-1.9.4, still ships fixable critical Debian
  # packages, and only the unreleased nightly cpu-latest is rebuilt on a patched base. The image is
  # pinned with the E01 model, runs only under the optional "embeddings" profile, publishes no port
  # and drops every capability; its only outbound call fetches the model weights once. Revisit at the
  # next text-embeddings-inference release.
  - vulnerability: CVE-2026-111497
    package: {name: libbrotli1, version: "1.0.9-2+b6", type: deb}
    reason: text-embeddings-inference cpu-1.9.3, optional local service; exception of 2026-11-06 (A40)
