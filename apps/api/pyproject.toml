[project]
name = "property-platform-api"
version = "0.0.0"
description = "Property Platform domain API and worker runtime"
requires-python = ">=3.14.8,<3.15"
dependencies = [
  "django==6.1.2",
  "django-ninja==1.7.1",
  "dj-database-url==3.1.2",
  "psycopg[binary]==3.3.6",
  "gunicorn==26.2.0",
  "boto3==1.43.114",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "ruff==0.17.0", "import-linter==2.15"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/property_platform"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "property_platform.config.settings.testing"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["postgis: requires a real PostgreSQL/PostGIS database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.importlinter]
root_package = "property_platform"

[[tool.importlinter.contracts]]
name = "Domain modules follow their dependency direction"
type = "layers"
layers = ["property_platform.modules.publication", "property_platform.modules.evidence", "property_platform.modules.catalog"]

[[tool.importlinter.contracts]]
name = "Evidence sub-packages follow their dependency direction"
type = "layers"
containers = ["property_platform.modules.evidence"]
layers = ["(rebuild)", "projects", "maps", "sources", "history"]

[[tool.importlinter.contracts]]
name = "Domain modules never import delivery or configuration"
type = "forbidden"
source_modules = ["property_platform.modules"]
forbidden_modules = ["property_platform.api", "property_platform.config"]

[[tool.importlinter.contracts]]
name = "Storage adapters remain independent of application and domain modules"
type = "forbidden"
source_modules = ["property_platform.object_storage"]
forbidden_modules = ["property_platform.modules", "property_platform.api", "property_platform.config"]
