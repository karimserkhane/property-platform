# Optional private phone preview. No host installation, privileged mode or public Funnel.
# Use with compose.yaml and both --profile web-preview --profile remote-preview.
services:
  remote-preview:
    profiles: [remote-preview]
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    entrypoint: [tailscaled]
    command:
      - --tun=userspace-networking
      - --state=/var/lib/tailscale/tailscaled.state
      - --socket=/tmp/tailscaled.sock
    # Serve proxies to 127.0.0.1:3000 in the web namespace. No published host port.
    network_mode: service:web
    depends_on:
      web:
        condition: service_started
    volumes:
      - remote-preview-state:/var/lib/tailscale
    tmpfs:
      - /tmp:mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped

volumes:
  # Contains private device identity. Never export to Git or share this volume.
  remote-preview-state:
