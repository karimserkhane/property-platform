# CI-equivalent checks in Docker, for people and AI agents (see docs/engineering/AGENT_WORKFLOW.md).
# From the repository (or worktree) root, with the local database already running, through
# the wrapper that keeps each worktree apart (A39):
#   bash scripts/checks/run.sh checks-api
#   bash scripts/checks/run.sh checks-ingestion
#   bash scripts/checks/run.sh checks-web
#   bash scripts/checks/run.sh checks-api bash scripts/checks/api.sh -k parcel_tiles
#   bash scripts/checks/run.sh build checks-web     # rebuild an image after a lockfile change
# The wrapper runs `docker compose ... --profile checks run --rm --no-deps <service>`: `--no-deps`
# never starts, stops or recreates shared services. It also sets, from the worktree's folder:
#   CHECKS_TAG      image tag of this worktree (property-platform-checks-api:<worktree>), so a
#                   build from one worktree never replaces the image another one runs;
#   CHECKS_VOLUMES  volume prefix of this worktree for the Linux node_modules, the Next.js
#                   output and the pnpm store of checks-web;
#   PLATFORM_EXTRA_CA_FILE  the approved HTTPS authority (TOOLCHAIN.md), when present, so the
#                   image builds and installs dependencies behind the Avast inspection.
# Without the wrapper, the former shared names are used (property-platform-checks-*:latest,
# property-platform-local_checks-* volumes): one run at a time.
# Each checks-api run creates and drops its own test_property_platform_<id> database
# (scripts/checks/api.sh); leftovers of a killed run: scripts/checks/clean-test-databases.sh.
x-checks-build: &checks-build
  context: ../..
  dockerfile: infra/local/checks/Dockerfile
  secrets: [platform_extra_ca]

services:
  checks-api:
    profiles: [checks]
    build:
      <<: *checks-build
      target: api
    image: property-platform-checks-api:${CHECKS_TAG:-latest}
    environment:
      DJANGO_SETTINGS_MODULE: property_platform.config.settings.testing
      DATABASE_URL: postgresql://property_platform:property-platform-local-only@db:5432/property_platform
      PROPERTY_PLATFORM_TEST_POSTGIS: "1"
      PYTHONPATH: /workspace/apps/api/src
      MEDIA_LOCAL_ROOT: /tmp/media
    volumes:
      - ../..:/workspace:ro
    command: ["bash", "scripts/checks/api.sh"]

  checks-ingestion:
    profiles: [checks]
    build:
      <<: *checks-build
      target: ingestion
    image: property-platform-checks-ingestion:${CHECKS_TAG:-latest}
    environment:
      PYTHONPATH: /workspace/apps/ingestion/src:/workspace/apps/api/src
      PREFECT_HOME: /tmp/prefect
      PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
    volumes:
      - ../..:/workspace:ro
    command: ["bash", "scripts/checks/ingestion.sh"]

  checks-web:
    profiles: [checks]
    build:
      <<: *checks-build
      target: web
    image: property-platform-checks-web:${CHECKS_TAG:-latest}
    environment:
      CHECK_BUILD: ${CHECK_BUILD:-0}
    # Linux dependencies and Next.js output live in volumes of this worktree, never in the
    # host tree.
    volumes:
      - ../..:/workspace
      - checks-node-modules:/workspace/node_modules
      - checks-web-node-modules:/workspace/apps/web/node_modules
      - checks-contracts-node-modules:/workspace/packages/contracts/node_modules
      - checks-branding-node-modules:/workspace/packages/branding/node_modules
      - checks-web-next:/workspace/apps/web/.next
      - checks-pnpm-store:/pnpm-store
    command: ["bash", "scripts/checks/web.sh"]

  # Browser journeys against the running local API (read only), with a compiled web
  # server started inside the container WITHOUT preview access control. Build first:
  #   bash scripts/checks/run.sh build checks-e2e
  #   bash scripts/checks/run.sh checks-e2e
  # Failure traces, screenshots and the HTML report are written to .cache/e2e/ of the worktree.
  checks-e2e:
    profiles: [checks]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: e2e
      secrets: [platform_extra_ca]
    image: property-platform-checks-e2e:${CHECKS_TAG:-latest}
    environment:
      E2E_API_ORIGIN: http://api:8000
    volumes:
      - ../../apps/web/e2e:/repo/apps/web/e2e:ro
      - ../../apps/web/playwright.config.ts:/repo/apps/web/playwright.config.ts:ro
      - ../../.cache/e2e:/artifacts
    ipc: host

secrets:
  # Optional build secret (TOOLCHAIN.md, "Autorité HTTPS supplémentaire dans Docker"): the
  # Dockerfiles ignore an empty file, which is the default outside Karim's machine.
  platform_extra_ca:
    file: ${PLATFORM_EXTRA_CA_FILE:-./checks/no-extra-ca.crt}

volumes:
  checks-node-modules:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-node-modules
  checks-web-node-modules:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-web-node-modules
  checks-contracts-node-modules:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-contracts-node-modules
  checks-branding-node-modules:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-branding-node-modules
  checks-web-next:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-web-next
  checks-pnpm-store:
    name: ${CHECKS_VOLUMES:-property-platform-local_checks}-pnpm-store
