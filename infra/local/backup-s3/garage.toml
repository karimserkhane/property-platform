# A30: local S3-compatible server for the encrypted backup copy (compose.backup-s3.yaml).
# Single node, no replication; the RPC secret, access key and bucket come from the environment
# (GARAGE_RPC_SECRET, GARAGE_DEFAULT_*), never from this file.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"
